<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scenes</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; height: 100vh; width: 100vw; }
    canvas { display: block; }
    #canvas-container { width: 100%; height: 100%; }
    #loader { position: fixed; inset: 0; z-index: 999; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.8s ease; }
    #loader.fade { opacity: 0; pointer-events: none; }
    #loader .title { color: #fff; font-family: 'Courier New', monospace; font-size: 14px; letter-spacing: 8px; opacity: 0.7; margin-bottom: 24px; }
    #loader .bar-bg { width: 180px; height: 3px; background: #1a1a1a; border-radius: 2px; overflow: hidden; }
    #loader .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #f7f3e6, #e8d9a0); transition: width 0.15s; }
    #loader .pct { color: #555; font-family: 'Courier New', monospace; font-size: 11px; margin-top: 10px; }
    #caption { position: fixed; left: 18px; bottom: 16px; z-index: 50; color: #fff; opacity: 0.30; font-family: 'Courier New', monospace; font-size: 12px; letter-spacing: 3px; pointer-events: none; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="caption"></div>
  <div id="loader">
    <div class="title">SCENES</div>
    <div class="bar-bg"><div class="bar-fill" id="loader-bar"></div></div>
    <div class="pct" id="loader-pct">0%</div>
  </div>

  <!-- order matters: kit -> scenes -> engine, all classic (non-module) scripts -->
  <script src="scene-kit.js"></script>
  <script src="scenes.js"></script>
  <script src="scene-engine.js"></script>
  <script>
    SceneEngine.boot({ scenes: SCENES });
  </script>
</body>
</html>
